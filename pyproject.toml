[project]
name = "dotfiles"
version = "0.0.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.basedpyright]
include = [
  ".",
  "bin/desktop-broker",
  "bin/check-hermes-web",
  "bin/check-tailscale-serve",
  "bin/incus-dev",
  "bin/kpf",
  "bin/prctl",
  "bin/run-if-changed",
]
exclude = [
  ".venv",
  "venv",
  "__pycache__",
  ".git",
  ".direnv",
  ".ruff_cache",
  "lab",
  "skills/skill-creator",
  "config/claude/status_line.py",
  "result",
  "nix/result",
  "**/node_modules",
  # Nested agent checkouts have their own source trees and dependencies.
  ".claude/worktrees",
  ".delta",
]
reportExplicitAny = false
reportAny = false
reportUnusedCallResult = false
reportImplicitOverride = false

[tool.ruff]
extend-include = [
  "bin/desktop-broker",
  "bin/check-hermes-web",
  "bin/check-tailscale-serve",
  "bin/incus-dev",
  "bin/kpf",
  "bin/prctl",
  "bin/run-if-changed",
]

[tool.ruff.lint]
select = ["I"]

[dependency-groups]
dev = ["pytest>=9.1.1", "requests>=2.34.2"]
