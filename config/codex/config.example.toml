file_opener = "none"
sandbox_mode = "workspace-write"
model = "gpt-6-astra"
model_reasoning_effort = "high"
model_reasoning_summary = "none"
model_verbosity = "low"
personality = "pragmatic"
web_search = "live"

# Closest native match to the Claude powerline segments: model, context %, git branch.
[tui]
status_line = ["model-with-reasoning", "context-used", "git-branch"]
theme = "monokai-extended"

[sandbox_workspace_write]
writable_roots = ["/Users/thrawny/.cache", "/Users/thrawny/.npm"]
network_access = true

[projects."/Users/thrawny/dotfiles"]
trust_level = "trusted"

[projects."/Users/thrawny/code"]
trust_level = "trusted"
