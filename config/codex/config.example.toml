file_opener = "none"
sandbox_mode = "workspace-write"
model = "gpt-6-astra"
model_reasoning_effort = "high"
model_reasoning_summary = "none"
model_verbosity = "low"
personality = "pragmatic"
web_search = "live"

# Status line: project, model, context usage, and Git branch.
[tui]
status_line = ["project-root", "model-with-reasoning", "context-used", "git-branch"]
theme = "monokai-extended"

[sandbox_workspace_write]
writable_roots = ["/home/thrawny/.cache", "/home/thrawny/.npm"]
network_access = true

[projects."/home/thrawny/dotfiles"]
trust_level = "trusted"

[projects."/home/thrawny/code"]
trust_level = "trusted"
