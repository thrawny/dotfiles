id = "thrawny.pr-review"
name = "PR review"
version = "0.1.0"
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]
description = "Pick a PR waiting on the team and open it in a codediff review"

[[actions]]
id = "open"
title = "Review a pull request"
contexts = ["workspace", "pane"]
command = ["sh", "-c", 'exec "$HERDR_BIN_PATH" plugin pane open --plugin thrawny.pr-review --entrypoint picker']

[[panes]]
id = "picker"
title = "Review a pull request"
placement = "popup"
width = "90%"
height = "80%"
# es-utils is a separate repo kept off PATH for non-interactive shells, so the
# path is spelled out rather than resolved.
command = ["sh", "-c", 'exec "$HOME/code/es-utils/bin/pr-review"']
