id = "thrawny.pr-review"
name = "PR review"
version = "0.2.0"
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]
description = "Pick a PR waiting on your team and open it in a codediff review"

[[actions]]
id = "open"
title = "Review a pull request"
contexts = ["workspace", "pane"]
command = ["sh", "-c", 'exec "$HERDR_BIN_PATH" plugin pane open --plugin thrawny.pr-review --entrypoint picker']

[[panes]]
id = "picker"
title = "Review a pull request"
placement = "popup"
width = "90%"
height = "80%"
command = ["pr-review"]
