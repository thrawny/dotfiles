# Requires AeroSpace 0.21.3+ for hover focus, auto-reload and Wispr Flow popup fixes.
# Keybindings follow niri where AeroSpace has a suitable equivalent.
config-version = 2
start-at-login = true
auto-reload-config = true

# Only the named workspaces persist when empty. Workspaces 4..10 are on demand.
persistent-workspaces = ['main', 'web', 'dotfiles']

# Keep the tiling tree normalized; this is not a scrolling-column layout.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 0

# Match niri: hover to focus, and move the pointer when keyboard focus changes.
focus-follows-mouse.enabled = true
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['move-mouse window-lazy-center']
automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

[mode.main.binding]
# Ghostty 1.3+ AppleScript creates a window in the existing app, not another process.
# On a cold start, let Ghostty open its initial window. macOS may ask for Automation access.
alt-enter = '''exec-and-forget osascript <<'APPLESCRIPT'
if application "Ghostty" is running then
    tell application "Ghostty" to activate window (new window)
else
    tell application "Ghostty" to activate
end if
APPLESCRIPT
'''

alt-w = 'close'
alt-f = 'fullscreen'                     # AeroSpace fullscreen, not a separate macOS Space.
alt-v = 'layout floating tiling'
alt-m = 'focus-back-and-forth'
alt-tab = 'focus-back-and-forth'
alt-shift-m = 'workspace-back-and-forth'

# Directional focus deliberately skips floating windows.
alt-h = 'focus left --ignore-floating'
alt-j = 'focus down --ignore-floating'
alt-k = 'focus up --ignore-floating'
alt-l = 'focus right --ignore-floating'

# Swap windows rather than restructuring the tiling tree with `move`.
alt-shift-h = 'swap left'
alt-shift-j = 'swap down'
alt-shift-k = 'swap up'
alt-shift-l = 'swap right'

# Focus monitors, move a window and follow it, or move the entire workspace.
# No workspace-to-monitor assignments: all workspaces can move freely.
alt-ctrl-h = 'focus-monitor left'
alt-ctrl-j = 'focus-monitor down'
alt-ctrl-k = 'focus-monitor up'
alt-ctrl-l = 'focus-monitor right'
alt-shift-ctrl-h = 'move-node-to-monitor --focus-follows-window left'
alt-shift-ctrl-j = 'move-node-to-monitor --focus-follows-window down'
alt-shift-ctrl-k = 'move-node-to-monitor --focus-follows-window up'
alt-shift-ctrl-l = 'move-node-to-monitor --focus-follows-window right'
alt-cmd-h = 'move-workspace-to-monitor left'
alt-cmd-j = 'move-workspace-to-monitor down'
alt-cmd-k = 'move-workspace-to-monitor up'
alt-cmd-l = 'move-workspace-to-monitor right'

# AeroSpace resizes in pixels rather than niri's percentage steps.
alt-minus = 'resize width -50'
alt-equal = 'resize width +50'
alt-shift-minus = 'resize height -50'
alt-shift-equal = 'resize height +50'

alt-1 = 'workspace main'
alt-2 = 'workspace web'
alt-3 = 'workspace dotfiles'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'
alt-b = 'workspace web'      # Helium windows stay where launched; move them manually.

alt-shift-1 = 'move-node-to-workspace --focus-follows-window main'
alt-shift-2 = 'move-node-to-workspace --focus-follows-window web'
alt-shift-3 = 'move-node-to-workspace --focus-follows-window dotfiles'
alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
alt-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
alt-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
alt-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
alt-shift-9 = 'move-node-to-workspace --focus-follows-window 9'
alt-shift-0 = 'move-node-to-workspace --focus-follows-window 10'

# Scratchpads, app jumps, monitor history, workspace cycling, project selection,
# bulk-close and niri-only column actions are intentionally unbound.
alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']

# Normal windows tile by default. Let AeroSpace identify dialogs and popups,
# including Wispr Flow overlays and Outlook reminders; do not force them to tile.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace main'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.microsoft.teams2'
run = 'move-node-to-workspace main'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.microsoft.Outlook'
run = 'move-node-to-workspace main'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.MobileSMS'
run = 'move-node-to-workspace main'

# Finder and Preview float on the workspace where they open.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.Preview'
run = 'layout floating'
