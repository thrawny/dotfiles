set -g default-terminal "tmux-256color"
set -g default-command "/bin/zsh"
set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind a send-prefix
set -g mouse on
set -sg escape-time 0
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on
set -g automatic-rename-format '#(cmd="#{pane_current_command}"; cmd="${cmd#.}"; cmd="${cmd%-unwrap*}"; cmd="${cmd%-wrap*}"; if [ -n "$cmd" ]; then printf "%s" "$cmd"; else printf "zsh"; fi)'
set -g allow-rename on
set -as terminal-overrides ',*:sitm=\E[3m'
set -as terminal-features ',*:hyperlinks'
set -g allow-passthrough on

bind -n C-S-h previous-window
bind -n C-S-l next-window
bind h previous-window
bind l next-window
bind n next-window
bind p previous-window
bind , last-window
bind . switch-client -l
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind c new-window -a -c '#{pane_current_path}'
bind < swap-window -t -1 \; previous-window
bind > swap-window -t +1 \; next-window
bind x kill-pane
bind X kill-window
bind C-n send-keys C-a n
bind C-p send-keys C-a p

bind -n WheelUpPane if-shell -F -t = '#{&&:#{alternate_on},#{m:*k9s*,#{window_name}}}' 'send-keys -t = -N 3 Up' 'if-shell -F -t = "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -e -t ="'
bind -n WheelDownPane if-shell -F -t = '#{&&:#{alternate_on},#{m:*k9s*,#{window_name}}}' 'send-keys -t = -N 3 Down' 'if-shell -F -t = "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "send-keys -t = -M"'
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

set -g status-position bottom
set -g status-justify left
set -g status-interval 10
set -g status-style 'bg={{tmux.bg}} fg={{semantic.foreground}}'
set -g status-left-length 40
set -g status-left ' #{?client_prefix,#[fg={{semantic.accent}}]#[bold]  #S,#[fg={{semantic.success}}]#[bold]  #S} #[fg={{tmux.gray}}]|  '
set -g window-status-separator ''
set -g window-status-format '  #[fg={{tmux.dimGray}}]#I:#[fg={{tmux.lightGray}}]#W  '
set -g window-status-current-format '#[bg={{tmux.darkGray}}]  #[fg={{syntax.function}},bold]#I:#[fg={{semantic.foreground}},bold]#W  #[bg={{tmux.bg}}]'
set -g status-right-length 1
set -g status-right ' '
set -g pane-border-style 'fg={{tmux.gray}}'
set -g pane-active-border-style 'fg={{syntax.function}}'
set -g message-style 'fg={{semantic.foreground}} bg={{tmux.darkGray}} bold'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @vim_navigator_check "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^ *[^TXZ ]+ +.*/n?vim(diff)?(-wrapped)?$'"
unbind -n C-\\
bind C-l send-keys 'C-l'
bind R source-file ~/.config/tmux/tmux.conf \; display-message 'Config reloaded...'

if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' 'run-shell ~/.tmux/plugins/tpm/tpm'
