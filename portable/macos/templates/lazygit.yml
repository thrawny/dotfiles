promptToReturnFromSubprocess: false
quitOnTopLevelReturn: true
git:
  diffRenderers:
    - colorArg: always
      command: "delta --paging=never --dark --syntax-theme='{{delta.syntaxTheme}}' --line-numbers --plus-style='syntax \"{{diff.added.lineBackground}}\"' --plus-emph-style='syntax \"{{diff.added.emphasisBackground}}\"' --plus-non-emph-style='syntax \"{{diff.added.dimBackground}}\"' --minus-style='syntax \"{{diff.removed.lineBackground}}\"' --minus-emph-style='syntax \"{{diff.removed.emphasisBackground}}\"' --minus-non-emph-style='syntax \"{{diff.removed.dimBackground}}\"' --line-numbers-plus-style='{{diff.added.foreground}}' --line-numbers-minus-style='{{diff.removed.foreground}}' --line-numbers-zero-style='{{semantic.muted}}'"
    - command: "difft --color=always --display=inline"
      type: extDiff
os:
  edit: '[ -z "$NVIM" ] && nvim {{filename}} || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}})'
  editAtLine: '[ -z "$NVIM" ] && nvim +{{line}} {{filename}} || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote +{{line}} {{filename}})'
