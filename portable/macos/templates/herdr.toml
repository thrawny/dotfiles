onboarding = false

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+a"
new_tab = "prefix+c"
previous_tab = ["ctrl+shift+h", "prefix+h", "prefix+p"]
next_tab = ["ctrl+shift+l", "prefix+l", "prefix+n"]
move_tab_previous = "prefix+shift+comma"
move_tab_next = "prefix+shift+period"
close_tab = "prefix+shift+x"
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
reload_config = "prefix+shift+r"

[ui]
tab_bar_position = "bottom"
prompt_new_tab_name = false
pane_outer_borders = false
pane_scrollbars = false
pane_gaps = false
sidebar_start_collapsed = false
sidebar_width = 26
sidebar_collapsed_mode = "compact"
status_indicators = "symbols"

[theme]
name = "terminal"

[theme.custom]
accent = "{{semantic.accent}}"
panel_bg = "{{semantic.surface}}"
sidebar_bg = "{{semantic.background}}"
active_row_bg = "{{tmux.darkGray}}"
selection_bg = "{{semantic.selection}}"
surface0 = "{{semantic.surface}}"
surface1 = "{{tmux.bg}}"
surface_dim = "{{semantic.background}}"
overlay0 = "{{semantic.border}}"
overlay1 = "{{semantic.muted}}"
text = "{{semantic.foreground}}"
subtext0 = "{{semantic.muted}}"
mauve = "{{semantic.accentAlt}}"
green = "{{semantic.success}}"
yellow = "{{syntax.function}}"
red = "{{semantic.error}}"
blue = "{{syntax.type}}"
teal = "{{syntax.type}}"
peach = "{{semantic.warning}}"

[advanced]
scrollback_limit_bytes = 50000000
