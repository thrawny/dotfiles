onboarding = false

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+a"
focus_agent = ["prefix+1..9", "super+1..9"]
next_agent = ["prefix+j", "super+j"]
previous_agent = ["prefix+k", "super+k"]
switch_tab = ""
next_workspace = "super+shift+j"
previous_workspace = "super+shift+k"
navigate_workspace_down = ["j", "down"]
navigate_workspace_up = ["k", "up"]
# In workspace navigation mode, reserve j/k for workspace selection.
navigate_pane_down = ""
navigate_pane_up = ""
new_tab = "prefix+c"
previous_tab = ["ctrl+shift+h", "prefix+h", "prefix+p"]
next_tab = ["ctrl+shift+l", "prefix+l", "prefix+n"]
move_tab_previous = "prefix+shift+comma"
move_tab_next = "prefix+shift+period"
close_tab = "prefix+shift+x"
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
open_notification_target = ["prefix+o", "super+o"]
reload_config = "prefix+shift+r"

[[keys.command]]
key = "super+p"
type = "plugin_action"
command = "thrawny.project-picker.open"
description = "Pick a project"

[ui]
tab_bar_position = "bottom"
prompt_new_tab_name = false
pane_outer_borders = false
pane_scrollbars = false
pane_gaps = false
sidebar_start_collapsed = false
sidebar_width = 26
sidebar_collapsed_mode = "compact"
status_indicators = "symbols"

[ui.sidebar.agents]
row_gap = 1
rows = [
  [{ token = "terminal_title_stripped", fg = "#f7f1ff", bold = true, dim = false }],
  [{ token = "state_icon", dim = false }, { token = "state_text", dim = false }, { token = "agent", fg = "#f7f1ff", dim = false }],
  [{ token = "workspace", fg = "#8b888f", dim = false }, { token = "machine", fg = "#8b888f", dim = false }],
]

[theme]
name = "terminal"

[theme.custom]
accent = "#fc618d"
panel_bg = "#272727"
sidebar_bg = "#222222"
active_row_bg = "#403e41"
selection_bg = "#49483e"
surface0 = "#272727"
surface1 = "#2d2a2e"
surface_dim = "#222222"
overlay0 = "#5f5b63"
overlay1 = "#8b888f"
text = "#f7f1ff"
subtext0 = "#8b888f"
mauve = "#948ae3"
green = "#7bd88f"
yellow = "#fce566"
red = "#fc618d"
blue = "#5ad4e6"
teal = "#5ad4e6"
peach = "#fc9867"

[advanced]
scrollback_limit_bytes = 50000000
